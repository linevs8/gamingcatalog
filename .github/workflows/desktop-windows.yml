name: Build and verify Playquill for Windows

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and package Windows application
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application and launcher
        run: |
          node --check electron/main.cjs
          node --check scripts/prepare-desktop.cjs
          node --check scripts/smoke-windows.cjs
          npm run lint
          npm run test

      - name: Compile Playquill local server
        run: npm run build

      - name: Bundle assets for desktop
        run: npm run desktop:prepare

      - name: Create unpacked Windows app for smoke test
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Verify packaged Next.js dependencies
        shell: pwsh
        run: |
          $sourceNext = ".next/standalone/node_modules/next/package.json"
          $packagedNext = "dist/win-unpacked/resources/app-server/node_modules/next/package.json"
          Write-Host "Standalone Next.js module present: $(Test-Path $sourceNext)"
          Write-Host "Packaged Next.js module present: $(Test-Path $packagedNext)"
          if (!(Test-Path $sourceNext)) { throw "Next standalone output omitted its Next.js runtime" }
          if (!(Test-Path $packagedNext)) { throw "Electron package omitted the Next.js runtime" }

      - name: Smoke-test packaged EXE and local server
        run: node scripts/smoke-windows.cjs dist/win-unpacked/Playquill.exe

      - name: Package Windows installer and portable EXE
        run: npx electron-builder --win --x64 --publish never

      - name: Upload verified Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: Playquill-Windows-x64-verified
          path: |
            dist/Playquill-Setup-*.exe
            dist/Playquill-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
