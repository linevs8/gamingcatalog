name: Build and verify Playquill for Windows

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified installer to GitHub Releases (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    name: Test and package Windows application
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application and launcher
        run: |
          node --check electron/main.cjs
          node --check electron/updater.cjs
          node --check electron/preload.cjs
          node --check scripts/prepare-desktop.cjs
          node --check scripts/smoke-windows.cjs
          npm run lint
          npm run test

      - name: Compile Playquill local server
        run: npm run build

      - name: Bundle assets for desktop
        run: npm run desktop:prepare

      - name: Create unpacked Windows app for smoke test
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Verify packaged Next.js dependencies
        shell: pwsh
        run: |
          $sourceNext = ".next/standalone/node_modules/next/package.json"
          $packagedNext = "dist/win-unpacked/resources/app-server/node_modules/next/package.json"
          Write-Host "Standalone Next.js module present: $(Test-Path $sourceNext)"
          Write-Host "Packaged Next.js module present: $(Test-Path $packagedNext)"
          if (!(Test-Path $sourceNext)) { throw "Next standalone output omitted its Next.js runtime" }
          if (!(Test-Path $packagedNext)) { throw "Electron package omitted the Next.js runtime" }

      - name: Smoke-test packaged EXE and local server
        run: node scripts/smoke-windows.cjs dist/win-unpacked/Playquill.exe

      - name: Package Windows installer and portable EXE
        run: npx electron-builder --win --x64 --publish never

      - name: Generate installer checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/Playquill-*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload verified Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: Playquill-Windows-x64-verified
          path: |
            dist/Playquill-Setup-*.exe
            dist/Playquill-Portable-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish permanent Windows release
    needs: build-windows
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Playquill-Windows-x64-verified
          path: release
      - name: Verify and publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test -f "release/Playquill-Setup-$version-x64.exe"
          test -f "release/Playquill-Portable-$version-x64.exe"
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "release/Playquill-Setup-$version-x64.exe" \
            "release/Playquill-Portable-$version-x64.exe" \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Playquill $version" \
            --notes "Windows x64 installer and portable edition. Packaged renderer, native save and backup smoke tests passed. Developer build: Windows code signing is not configured. Download from this official release and verify SHA256SUMS.txt."
