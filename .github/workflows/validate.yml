name: Validate Gaming HQ
on:
  pull_request:
  push:
    branches:
      - main
      - feat/first-working-slice
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Test data invariants
        run: npm run test
      - name: Build
        run: npm run build
